name: vscode-extension

on:
  push:
    branches: [main, vs-extension]
    paths: ['vs-extension/**', '.github/workflows/vscode.yml']
  pull_request:
    paths: ['vs-extension/**', '.github/workflows/vscode.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: vs-extension

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to a commit, not a tag: a moved tag cannot change what runs here.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vs-extension/package-lock.json

      # Frozen lockfile, and no dependency's install script ever runs (.npmrc also sets ignore-scripts).
      - run: npm ci --ignore-scripts

      # lint, tsc, vitest with the engine coverage floor, ReDoS check of every regex, build, bundle check
      - run: npm run ci

      # The packaged extension, and its checksum to publish next to the download.
      - run: npx vsce package --no-dependencies
      - run: sha256sum *.vsix | tee SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stack3-vscode
          path: |
            vs-extension/*.vsix
            vs-extension/SHA256SUMS
          if-no-files-found: error
