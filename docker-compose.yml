# Stack3 Security: whole-project stack.
# Today it runs the Chrome/core API (identity, billing, teams) with Redis; the database is Supabase Postgres
# (DATABASE_URL in chrome-extension-backend/backend/.env). Imran's VS Code API (`vscode-api`) and the Caddy reverse
# proxy will be added here once their Dockerfiles exist.
# Made by Yash Jain with passion.
#
# Run:   docker-compose up --build -d
# Logs:  docker-compose logs -f chrome-api
# Stop:  docker-compose down
#
# Offline fallback (no Supabase): set in .env
#   DATABASE_URL=postgresql+asyncpg://stack3:stack3-local-only@postgres:5432/stack3
# and run:  docker-compose --profile local-db up --build -d

name: stack3

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  chrome-api:
    build:
      context: ./chrome-extension-backend/backend
    restart: unless-stopped
    env_file:
      - ./chrome-extension-backend/backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      DB_SCHEMA: chrome
      PORT: "8000"
    volumes:
      - chrome-api-dev-keys:/srv/.dev-keys
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false

  postgres:
    image: postgres:16-alpine
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: stack3
      POSTGRES_PASSWORD: stack3-local-only
      POSTGRES_DB: stack3
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stack3 -d stack3"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  chrome-api-dev-keys:
