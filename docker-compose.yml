# Stack3 Security: whole-project stack.
# Website (frontend/website — React + TypeScript + Vite) on http://localhost:3000, Chrome/core API on
# http://localhost:8000, VS Code repo-scan API on http://localhost:8080. Redis is local. Postgres is Supabase
# (DATABASE_URL in chrome-extension-backend/backend/.env).
# Made by Yash Jain with passion.
#
# Run:   docker-compose up --build -d
# Logs:  docker-compose logs -f chrome-api webpage vscode-api
# Stop:  docker-compose down
#
# Offline fallback (no Supabase): set in .env
#   DATABASE_URL=postgresql+asyncpg://stack3:stack3-local-only@postgres:5432/stack3
# and run:  docker-compose --profile local-db up --build -d

name: stack3

services:
  webpage:
    build:
      context: ./frontend/website
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Open the site as http://localhost:3000 (not 127.0.0.1): the API only accepts that exact origin
    ports:
      - "127.0.0.1:${WEBPAGE_PORT:-3000}:3000"
    depends_on:
      chrome-api:
        condition: service_started

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  chrome-api:
    build:
      context: ./chrome-extension-backend/backend
    restart: unless-stopped
    env_file:
      - ./chrome-extension-backend/backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      DB_SCHEMA: chrome
      PORT: "8000"
    volumes:
      - chrome-api-dev-keys:/srv/.dev-keys
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false

  # Imran's repo-scan service. Callers send X-Service-Key. It reports threats to chrome-api.
  # SERVICE_KEY is INTERNAL_SERVICE_KEY from the Chrome API env file. Other secrets in that file are dropped
  # before the process starts. Clones need a writable /tmp and are deleted after each scan.
  vscode-api:
    build:
      context: ./vs-extension
    restart: unless-stopped
    env_file:
      - ./chrome-extension-backend/backend/.env
    environment:
      STACK3_API_URL: http://chrome-api:8000
      PORT: "8080"
    tmpfs:
      - /tmp:rw,mode=1777
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      chrome-api:
        condition: service_started
    command:
      - sh
      - -c
      - |
        if [ -z "$$SERVICE_KEY" ]; then export SERVICE_KEY="$$INTERNAL_SERVICE_KEY"; fi
        unset DATABASE_URL JWT_PRIVATE_KEY SMTP_PASSWORD TIGERGRAPH_PASSWORD TIGERGRAPH_SECRET TIGERGRAPH_API_KEY DODO_API_KEY DODO_WEBHOOK_SECRET ETHERSCAN_API_KEY RPC_URL_ETHEREUM OTP_PEPPER INTERNAL_SERVICE_KEY REDIS_URL
        exec node dist/server.js

  postgres:
    image: postgres:16-alpine
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: stack3
      POSTGRES_PASSWORD: stack3-local-only
      POSTGRES_DB: stack3
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stack3 -d stack3"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  chrome-api-dev-keys:
